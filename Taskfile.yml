version: "3"

tasks:
  profile:
    desc: "Fetch LinkedIn profile info and save as JSON using uv run"
    cmds:
      - uv run python src/test_api.py {{.CLI_ARGS}}

  install:
    desc: "Install project dependencies using uv sync"
    cmds:
      - uv sync

  convert:md:
    desc: "Convert PDF(s) to Markdown using uv run"
    cmds:
      - uv run python src/convert/pdf_to_md.py {{.CLI_ARGS}}

  pdf:cv:
    desc: "Generate CV PDF from Markdown"
    env:
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
    cmds:
      - uv run python src/pdf/pdf_build.py {{if .input}}--input {{.input}}{{end}} {{.CLI_ARGS}}

  pdf:fonts:
    desc: "Download fonts for PDF generation"
    cmds:
      - uv run python src/pdf/pdf_fonts.py

  pdf:pandoc:
    desc: "Convert Markdown to PDF using Pandoc"
    cmds:
      - pandoc --to pdf {{.input}} -o {{.output}} --pdf-engine=weasyprint --css=src/pdf/styles/prolab.css

  cv:generate:
    desc: "Generate a job-specific CV from generic sources using Codex CLI"
    cmds:
      - bash scripts/gen_cv.sh {{.CLI_ARGS}}

  cv:match:
    desc: "Compare CV with job description and generate a match report using Gemini or Codex"
    cmds:
      - bash scripts/match_cv.sh {{.CLI_ARGS}}

  llm:compact:
    desc: "Compact a Markdown file using local LMStudio API"
    cmds:
      - uv run python src/llm/llm_compact.py {{.CLI_ARGS}}
