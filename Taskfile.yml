version: "3"

env:
  DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib

tasks:
  install:
    desc: "Install project dependencies"
    cmds:
      - uv sync

  test:
    desc: "Run the test suite"
    cmds:
      - uv run python -m unittest discover tests

  limd:
    desc: "Run the limd CLI, e.g. task limd -- cv build --input profile/cv.md"
    cmds:
      - uv run limd {{.CLI_ARGS}}

  pdf:cv:
    desc: "Render a Markdown CV to PDF (input=<path>)"
    cmds:
      - uv run limd cv build --input {{.input}}

  pdf:fonts:
    desc: "Download fonts for PDF generation"
    cmds:
      - uv run limd fonts
