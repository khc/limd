[project]
name = "limd"
version = "0.1.0"
description = "Toolkit for fine-tuning a CV and a LinkedIn profile"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2",
    "markdown",
    "markdown-it-py",
    "pymupdf4llm",
    "pyyaml",
    "weasyprint>=68,<69",
]

[project.scripts]
limd = "limd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"limd" = ["prompts/*.md"]
"limd.pdf" = ["templates/*"]
